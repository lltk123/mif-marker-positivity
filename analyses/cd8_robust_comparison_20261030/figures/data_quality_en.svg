   <text style="font-size: 7px; font-family: 'Noto Sans CJK JP'; text-anchor: start" x="35.2085" y="208.472" transform="rotate(-0 35.2085 208.472)">All instances, including unlabeled cells. a: finite instance pixels; b: cells.</text>
